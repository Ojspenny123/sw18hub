<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Forms</title></head>
<body>
<!-- Static copies of the forms so Netlify Forms can detect them. Keep field names in sync with the LeadForm usages. -->
<form name="waitlist" data-netlify="true" hidden>
  <input type="email" name="email">
</form>
<form name="business-interest" data-netlify="true" hidden>
  <input type="text" name="business">
  <input type="email" name="email">
</form>
</body>
</html>
