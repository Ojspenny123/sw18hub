name: locations-and-photos
# Free, one-off: places unmatched venues by street address, then looks for openly licensed photos.
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/geocode-addresses.mjs
      - scripts/commons-images.mjs
      - .github/workflows/locations-and-photos.yml
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/geocode-addresses.mjs
      - run: node scripts/commons-images.mjs
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/venue-osm.json data/venue-images.json
          git diff --staged --quiet || (git commit -m "Place venues by address; add Commons photos [skip ci]" && git push)
