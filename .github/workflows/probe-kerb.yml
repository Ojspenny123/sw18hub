name: probe-kerb
# One-off: reads KERB's public pages for a popup photo and commits the findings.
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/probe-kerb-image.mjs
      - .github/workflows/probe-kerb.yml
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-kerb-image.mjs
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/probe-kerb.json
          git diff --staged --quiet || (git commit -m "Probe KERB pages for a popup photo [skip ci]" && git push)
